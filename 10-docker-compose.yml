# ============================================================================
#  Asistente IA de Pedidos — entorno de desarrollo local
#  Ubicación en el repo: ./docker-compose.yml
#  Uso:  docker compose up -d
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asistente_pedidos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-shadow-db.sql:/docker-entrypoint-initdb.d/init-shadow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ap_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
# ============================================================================
#  Crear también ./docker/init-shadow-db.sql con una sola línea:
#
#     CREATE DATABASE asistente_pedidos_shadow;
#
#  Prisma Migrate la necesita en desarrollo (SHADOW_DATABASE_URL del .env).
# ============================================================================
